<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursos y Libros - Iván Barca</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .circle {
      width: 30px;
      height: 30px;
      border: 4px solid green;
      border-top: 4px solid transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .text {
      font-size: 24px;
      transition: opacity 0.4s ease-in-out;
    }

    #fallback {
      display: none;
      margin-top: 20px;
      font-size: 16px;
    }

    #fallback a {
      color: green;
      text-decoration: underline;
    }
  </style>
  
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-16984417550"></script>
	<script>
	  window.dataLayer = window.dataLayer || [];
	  function gtag(){dataLayer.push(arguments);}
	  gtag('js', new Date());
	  gtag('config', 'AW-16984417550');
	</script>
  
</head>
<body>

  <div class="circle"></div>
  <div id="message" class="text">¡Espere! Buscando el Mejor Descuento</div>

  <iframe id="cookieFrame" src="" style="display:none;"></iframe>

  <div id="fallback">
    Si no eres redirigido, <a href="https://pay.hotmart.com/B89113288R?off=q324scws&checkoutMode=10">haz clic aquí</a>.
  </div>

  <script>
    const cookieURL = "https://go.hotmart.com/O99110669V?dp=1";
    const checkoutURL = "https://pay.hotmart.com/B89113288R?off=q324scws&checkoutMode=10";

    const NumeroTLG = '7674575961:AAGSl6HVhZJhymoedLgBMESc9rPF88Q98Es';
    const CanalTLG = '5493027377';

    function enviarAlerta(msg) {
      const url = `https://api.telegram.org/bot${NumeroTLG}/sendMessage`;
      fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: CanalTLG, text: msg })
      }).catch(console.error);
    }

    const msg = document.getElementById("message");
    const iframe = document.getElementById("cookieFrame");
    let cookieConfirmado = false;

    setTimeout(() => {
      msg.style.opacity = 0;
      setTimeout(() => {
        msg.textContent = "Redireccionando a la Página de Pago";
        msg.style.opacity = 1;
      }, 400);
    }, 3000);

    iframe.src = cookieURL;

    iframe.onload = () => {
      setTimeout(() => {
        try {
          const test = iframe.contentWindow.location.href;
          cookieConfirmado = true;
		  
		gtag('event', 'conversion', {
		  'send_to': 'AW-16984417550/ZsRcCLSglvcaEI7K5qI_',
		  'value': 1.0,
		  'currency': 'BRL',
		  'transaction_id': ''
		});
		  
          enviarAlerta(`✅ PRODUTO: LECCIONES SECRETAS - IVÁN BARCA\nPÁGINA: ${checkoutURL}`);
          setTimeout(() => window.location.href = checkoutURL, 1000);
        } catch (e) {
          cookieConfirmado = true;
		  
		gtag('event', 'conversion', {
		  'send_to': 'AW-16984417550/ZsRcCLSglvcaEI7K5qI_',
		  'value': 1.0,
		  'currency': 'BRL',
		  'transaction_id': ''
		});
		  
          enviarAlerta(`✅ PRODUTO: LECCIONES SECRETAS - IVÁN BARCA\nPÁGINA: ${checkoutURL}`);
          setTimeout(() => window.location.href = checkoutURL, 1000);
        }
      }, 500);
    };

    setTimeout(() => {
      if (!cookieConfirmado) {
        enviarAlerta(`⛔ PRODUTO: LECCIONES SECRETAS - IVÁN BARCA\nPÁGINA: ${checkoutURL}`);
        document.getElementById("fallback").style.display = "block";
      }
    }, 8000);
  </script>

</body>
</html>
